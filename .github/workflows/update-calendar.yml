name: Update O'Punch calendar

on:
  schedule:
    # every day at 04:17 UTC (odd minute avoids the top-of-hour rush)
    - cron: "17 4 * * *"
  workflow_dispatch:      # allows "Run workflow" button in the Actions tab
  push:
    paths:
      - opunch_to_ics.py
      - .github/workflows/update-calendar.yml

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ICS files
        run: |
          python3 opunch_to_ics.py -o docs/opunch.ics
          python3 opunch_to_ics.py -o docs/opunch-regional-national.ics --levels 2 3 --name "Orienteering Belgium - regional & national"
          python3 opunch_to_ics.py -o docs/opunch-national.ics --levels 3 --name "Orienteering Belgium - national"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          # DTSTAMP changes every run; only commit when the event content changed
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          if git diff --cached -I '^DTSTAMP:' --quiet; then
            echo "Only DTSTAMP changed, skipping commit"; git reset -q; exit 0
          fi
          git commit -m "Update calendar $(date -u +%Y-%m-%d)"
          git push
