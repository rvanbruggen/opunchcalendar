name: Update O'Punch calendar

on:
  schedule:
    # every day at 00:11 UTC (odd minute avoids the top-of-hour rush)
    - cron: "11 0 * * *"
  workflow_dispatch:      # allows "Run workflow" button in the Actions tab
  push:
    paths:
      - opunch_to_ics.py
      - .github/workflows/update-calendar.yml

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ICS files
        id: generate
        run: |
          python3 opunch_to_ics.py -o docs/opunch.ics
          python3 opunch_to_ics.py -o docs/opunch-regional-national.ics --levels 2 3 --name "Orienteering Belgium - regional & national"
          python3 opunch_to_ics.py -o docs/opunch-national.ics --levels 3 --name "Orienteering Belgium - national"

      # Runs after both success and failure, so every run leaves a line in docs/update-log.txt
      - name: Log the run and commit
        if: success() || failure()
        env:
          OUTCOME: ${{ steps.generate.outcome }}
          TRIGGER: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$OUTCOME" != "success" ]; then
            # never publish half-written feeds
            git checkout -- docs/*.ics
            result="FAILED"
            counts="-"
          else
            if git diff --quiet -I '^DTSTAMP:' -- docs/*.ics; then
              # DTSTAMP changes every run; keep the published files when nothing else did
              git checkout -- docs/*.ics
              result="unchanged"
            else
              result="changed"
            fi
            counts=$(for f in opunch opunch-regional-national opunch-national; do
                       grep -c '^BEGIN:VEVENT' "docs/$f.ics"; done | paste -sd/ -)
          fi
          printf '%s  %-9s  %-17s  %s\n' "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "$result" "$TRIGGER" "$counts" >> docs/update-log.txt
          git add docs/update-log.txt docs/*.ics
          if [ "$result" = "changed" ]; then msg="Update calendar"; else msg="Log calendar check"; fi
          git commit -q -m "$msg $(date -u +%Y-%m-%d)"
          git pull --rebase -q
          git push
